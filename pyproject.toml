[project]
name = "enterprice-rag"
version = "0.1.0"
description = "Production-oriented RAG application using Groq, BGE-M3, and Qdrant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain>=0.3,<2.0",
    "langchain-community>=0.3,<1.0",
    "langchain-huggingface>=0.1,<2.0",
    "langchain-qdrant>=0.2,<2.0",
    "langchain-text-splitters>=0.3,<2.0",
    "langchain-groq>=0.2,<2.0",
    "pydantic>=2.9,<3.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "qdrant-client>=1.12,<2.0",
    "sentence-transformers>=3.0,<7.0",
    "torch>=2.0,<3.0",
    "transformers>=4.40,<6.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
